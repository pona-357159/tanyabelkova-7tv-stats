                                "<div class=\"text-xs flex justify-between items-center text-gray-300\">" +
                                "<span class=\"truncate max-w-[140px] flex items-center gap-1.5\">" +
                                "<span class=\"text-gray-500 font-mono\">" + (i + 1) + ".</span>" +
                                "<span>" + escapeHtml(u.username) + "</span>" +
                                (u.isBot ? "<span class=\"text-[9px] bg-purple-600/20 text-purple-300 px-1.5 py-0.2 rounded font-sans\">bot</span>" : "") +
                                "</span>" +
                                "<span class=\"text-[10px] text-purple-300 font-mono\">" + u.count.toLocaleString() + "</span>" +
                                "</div>"
                            ).join("") +
                            "</div></div>" : "";

                        const topUsersSummary = e.computedTopUsers.map(u => u.username + (u.isBot ? " [bot]" : "") + " (" + u.count.toLocaleString() + ")").join(", ");

                        return (
                            "<tr class=\"hover:bg-darkbg/50 transition\">" +
                            "<td class=\"p-3\"><div class=\"table-popover-wrapper inline-block\">" +
                            (e.imgUrl ? "<img data-src=\"" + e.imgUrl + "\" alt=\"" + escapeHtml(e.name) + "\" loading=\"lazy\" decoding=\"async\" onload=\"handleImgLoad(this)\" onerror=\"handleImgError(this)\" class=\"w-8 h-8 object-contain cursor-pointer\">" : "-") +
                            "</div></td>" +
                            "<td class=\"p-3 font-semibold text-white truncate max-w-[160px]\">" + escapeHtml(e.name) + "</td>" +
                            "<td class=\"p-3 font-bold text-purple-400\">" + e.count.toLocaleString() + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-400\">" + e.addedFormatted + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-400\">" + e.lastUsedFormatted + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-300 relative\">" +
                            (topUsersSummary ? 
                                "<div class=\"table-popover-wrapper relative inline-block w-full\">" +
                                topUsersPopoverHtml +
                                "<div class=\"truncate cursor-pointer text-purple-300 underline decoration-dashed decoration-gray-600 underline-offset-4 w-full\">" +
                                escapeHtml(topUsersSummary) +
                                "</div></div>" : "-") +
                            "</td>" +
                            "<td class=\"p-3\">" +
                            (e.pageUrl !== "#" ? "<a href=\"" + e.pageUrl + "\" target=\"_blank\" class=\"text-xs text-purple-400 hover:underline\">7TV Page</a>" : "-") +
                            "</td></tr>"
                        );
                    }).join("");
                    enqueueImages(tableViewContainer.querySelectorAll("img[data-src]"));
                }
            }
        }

        const chkIncludeOffline = document.getElementById("chkIncludeOffline");
        const chkIncludeBots = document.getElementById("chkIncludeBots");
        const chkIncludeDuplicates = document.getElementById("chkIncludeDuplicates");

        [chkIncludeOffline, chkIncludeBots, chkIncludeDuplicates].forEach(chk => { if (chk) chk.addEventListener("change", renderEmotes); });
        if (searchInput) searchInput.addEventListener("input", renderEmotes);
        if (sortSelect) sortSelect.addEventListener("change", renderEmotes);

        if (viewGridBtn) {
            viewGridBtn.addEventListener("click", () => {
                currentView = "grid";
                viewGridBtn.classList.replace("text-gray-400", "text-white");
                viewGridBtn.classList.add("bg-purple-600");
                if (viewTableBtn) { viewTableBtn.classList.replace("text-white", "text-gray-400"); viewTableBtn.classList.remove("bg-purple-600"); }
                renderEmotes();
            });
        }

        if (viewTableBtn) {
            viewTableBtn.addEventListener("click", () => {
                currentView = "table";
                viewTableBtn.classList.replace("text-gray-400", "text-white");
                viewTableBtn.classList.add("bg-purple-600");
                if (viewGridBtn) { viewGridBtn.classList.replace("text-white", "text-gray-400"); viewGridBtn.classList.remove("bg-purple-600"); }
        renderEmotes();
            });
        }

        document.addEventListener("DOMContentLoaded", () => { renderEmotes(); });
    </script>
</body>
</html>
